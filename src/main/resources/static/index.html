<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text2SQL Agent</title>
  <style>
    :root {
      --sidebar-bg: #171717;
      --sidebar-hover: #212121;
      --sidebar-text: #ececec;
      --sidebar-muted: #8e8e8e;
      --main-bg: #ffffff;
      --chat-text: #0d0d0d;
      --border-color: #e5e5e5;
      --card-bg: #f9f9f9;
      --input-bg: #f4f4f4;
      --accent: #10a37f;
      --accent-hover: #0d8a6a;
      --user-msg-bg: #f4f4f4;
      --tag-reused: #7c3aed;
      --sql-bg: #1e1e1e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh; display: flex; overflow: hidden; background: var(--main-bg); color: var(--chat-text);
    }

    /* 侧边栏 (ChatGPT 风格) */
    aside {
      width: 260px; background: var(--sidebar-bg); color: var(--sidebar-text);
      display: flex; flex-direction: column; flex-shrink: 0; height: 100%; border-right: 1px solid #2a2a2a;
    }
    .sidebar-header { padding: 14px 16px; }
    .new-chat-btn {
      width: 100%; padding: 10px 14px; background: transparent; border: 1px solid #3e3e3e;
      border-radius: 8px; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; transition: all 0.2s;
    }
    .new-chat-btn:hover { background: var(--sidebar-hover); border-color: #555; }
    
    .session-list {
      flex: 1; overflow-y: auto; padding: 10px 10px; display: flex; flex-direction: column; gap: 4px;
    }
    .session-list-title {
      font-size: 11px; text-transform: uppercase; color: var(--sidebar-muted); padding: 8px 10px 6px; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.5px;
    }
    .session-item {
      padding: 9px 10px; border-radius: 8px; font-size: 13px; color: #d1d5db; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; transition: background 0.15s;
      user-select: none;
    }
    .session-item:hover, .session-item.active { background: var(--sidebar-hover); color: #fff; }
    .session-item.active { border-left: 2px solid #fff; }
    .session-item-content {
      display: flex; align-items: center; gap: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .session-item svg { flex-shrink: 0; opacity: 0.7; }
    .session-item-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .session-badge {
      font-size: 10px; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,0.08); color: #9ca3af; flex-shrink: 0;
    }
    .session-badge-persisted { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .session-del-btn {
      opacity: 0; background: transparent; border: 0; color: #9ca3af; cursor: pointer; padding: 3px 5px;
      border-radius: 4px; display: flex; align-items: center; transition: all 0.15s; flex-shrink: 0;
    }
    .session-item:hover .session-del-btn { opacity: 0.8; }
    .session-del-btn:hover { opacity: 1; color: #ef4444; background: rgba(239, 68, 68, 0.2); }

    /* 主聊天区域 */
    .main-container {
      flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; background: #fff;
    }
    header.chat-header {
      height: 56px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center;
      justify-content: space-between; padding: 0 24px; flex-shrink: 0;
    }
    .model-selector {
      display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; color: #202123;
    }


    /* 消息流 */
    .chat-scroll {
      flex: 1; overflow-y: auto; padding: 24px 0 140px; display: flex; flex-direction: column;
    }
    .chat-inner {
      max-width: 820px; width: 100%; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 28px;
    }

    /* 初始空状态引导卡片 */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin-top: 60px; text-align: center;
    }
    .empty-logo {
      width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: flex;
      align-items: center; justify-content: center; color: #fff; margin-bottom: 16px;
    }
    .empty-title { font-size: 22px; font-weight: 600; margin-bottom: 24px; color: #0d0d0d; }
    .prompt-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 760px; width: 100%;
    }
    .prompt-card {
      background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 16px;
      text-align: left; cursor: pointer; transition: all 0.2s;
    }
    .prompt-card:hover { background: #f9f9f9; border-color: #c5c5d2; transform: translateY(-1px); }
    .prompt-card-title { font-size: 13px; font-weight: 600; color: #2d3748; margin-bottom: 4px; }
    .prompt-card-sub { font-size: 12px; color: #718096; line-height: 1.4; }

    /* 对话气泡 (ChatGPT 样式) */
    .msg-row { display: flex; gap: 16px; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .user-bubble {
      background: var(--user-msg-bg); color: #0d0d0d; padding: 10px 18px; border-radius: 20px;
      font-size: 15px; line-height: 1.5; max-width: 80%; word-break: break-word;
    }

    .agent-avatar {
      width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
    }
    .agent-content { flex: 1; min-width: 0; font-size: 14px; line-height: 1.6; }

    /* 气泡内部组件 */
    .intent-tag {
      display: inline-flex; align-items: center; gap: 6px; background: #eff6ff; color: #1d4ed8;
      border: 1px solid #bfdbfe; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
      margin-bottom: 12px;
    }
    .status-capsules { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .capsule {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 9999px; text-transform: uppercase;
    }
    .capsule-success { background: #dcfce7; color: #15803d; }
    .capsule-reused { background: #f3e8ff; color: var(--tag-reused); border: 1px solid #e9d5ff; }
    .capsule-limit { background: #fef3c7; color: #b45309; }
    .capsule-err { background: #fee2e2; color: #b91c1c; }

    /* SQL 代码框 (黑色磨砂 MacOS 风格) */
    .sql-card {
      background: var(--sql-bg); border-radius: 8px; overflow: hidden; margin: 12px 0 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .sql-card-header {
      background: #2d2d2d; padding: 6px 14px; display: flex; justify-content: space-between;
      align-items: center; font-size: 12px; color: #9ca3af;
    }
    .sql-card-body {
      padding: 14px 16px; overflow-x: auto; font-family: "JetBrains Mono", Consolas, Monaco, monospace;
      font-size: 13px; color: #f8fafc; line-height: 1.6;
    }
    .copy-btn {
      background: transparent; border: 0; color: #9ca3af; cursor: pointer; font-size: 12px;
      display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px;
    }
    .copy-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }

    /* 表格容器 */
    .result-table-wrap {
      border: 1px solid var(--border-color); border-radius: 8px; overflow-x: auto; margin: 12px 0 16px;
    }
    table.data-table {
      width: 100%; border-collapse: collapse; font-size: 13px; text-align: left;
    }
    table.data-table th {
      background: #f8fafc; border-bottom: 1px solid var(--border-color); padding: 8px 12px;
      font-weight: 600; color: #475569;
    }
    table.data-table td {
      border-bottom: 1px solid #f1f5f9; padding: 7px 12px; color: #1e293b;
    }
    table.data-table tr:last-child td { border-bottom: none; }
    table.data-table tr:hover { background: #f8fafc; }

    /* 链路诊断面板 */
    details.trace-card {
      background: #fbfbfb; border: 1px solid var(--border-color); border-radius: 8px;
      padding: 8px 12px; font-size: 12px; color: #64748b; margin-top: 8px;
    }
    details.trace-card summary { cursor: pointer; font-weight: 500; outline: none; }
    .trace-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 12px; margin-top: 8px;
      padding-top: 8px; border-top: 1px solid #eee;
    }
    .trace-item b { color: #334155; margin-right: 4px; }

    /* 底部悬浮输入框 (ChatGPT 风格) */
    .input-floating-bar {
      position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #fff 35%);
      padding: 10px 20px 24px; display: flex; flex-direction: column; align-items: center;
    }
    .input-box-wrapper {
      max-width: 820px; width: 100%; background: var(--input-bg); border: 1px solid var(--border-color);
      border-radius: 24px; padding: 10px 16px; display: flex; align-items: flex-end; gap: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04); transition: border-color 0.2s;
    }
    .input-box-wrapper:focus-within { border-color: #888; background: #fff; }
    textarea.chat-input {
      flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px; font-family: inherit;
      resize: none; max-height: 180px; min-height: 24px; line-height: 1.5; padding: 2px 0;
    }
    .send-btn {
      width: 32px; height: 32px; border-radius: 50%; background: #000; color: #fff; border: 0;
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .send-btn:disabled { opacity: 0.25; cursor: not-allowed; }

    /* 骨架屏加载动画 */
    .loading-pulse { display: flex; align-items: center; gap: 6px; padding: 6px 0; color: #666; font-size: 14px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #666; animation: pulse 1.4s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.1); } }
    /* 开发者模式样式控制：默认隐藏底层 SQL 与技术链路指标 */
    body.hide-dev .dev-only { display: none !important; }

    /* API Key 设置弹窗样式 (BYOK) */
    .btn-key-settings {
      display: flex; align-items: center; gap: 6px; padding: 5px 12px;
      border: 1px solid #e2e8f0; border-radius: 6px; background: #f8fafc;
      color: #475569; font-size: 13px; font-weight: 500; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-key-settings:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .key-indicator-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; display: inline-block;
    }
    .key-indicator-dot.active { background: #10b981; }
    .key-indicator-dot.warning { background: #f59e0b; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45); display: flex; align-items: center;
      justify-content: center; z-index: 1000; backdrop-filter: blur(2px);
    }
    .modal-box {
      background: #fff; width: 92%; max-width: 480px; border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
      overflow: hidden; animation: modal-in 0.2s ease-out;
    }
    @keyframes modal-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      padding: 16px 20px; border-bottom: 1px solid #f1f5f9;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title { font-weight: 600; font-size: 15px; color: #1e293b; }
    .modal-close-btn {
      background: transparent; border: 0; font-size: 20px; color: #94a3b8;
      cursor: pointer; line-height: 1; padding: 0 4px;
    }
    .modal-close-btn:hover { color: #475569; }
    .modal-body { padding: 20px; }
  </style>
</head>
<body class="hide-dev">

  <!-- 左侧边栏 -->
  <aside>
    <div class="sidebar-header">
      <button class="new-chat-btn" id="btn-new">
        <span>+ 开启新对话</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="session-list" id="session-history">
      <div class="session-list-title">
        <span>会话历史</span>
        <span id="session-count-badge" style="font-size:10px; color:#6b7280; font-weight:normal;">0 个会话</span>
      </div>
      <div id="session-items-container" style="display:flex; flex-direction:column; gap:3px;"></div>
    </div>
  </aside>

  <!-- 主对话容器 -->
  <div class="main-container">
    <header class="chat-header">
      <div class="model-selector">
        <span>Text2SQL Agent</span>
        <span style="color:#cbd5e1; margin:0 6px;">|</span>
        <span id="session-title-label" style="font-size:13px; color:#475569; font-weight:500; max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">新会话</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <button id="btn-key-settings" class="btn-key-settings" onclick="openApiKeyModal()" title="配置个人的 DeepSeek API Key (BYOK)">
          <span id="key-dot" class="key-indicator-dot warning"></span>
          <span id="key-badge-text">配置 API Key</span>
        </button>
      </div>
    </header>

    <div class="chat-scroll" id="chat-scroller">
      <div class="chat-inner" id="chat-messages">
        <!-- 初始空状态 -->
        <div class="empty-state" id="empty-state">
          <div class="empty-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <div class="empty-title">我能帮您分析什么电商数据？</div>
          <div class="prompt-grid">
            <div class="prompt-card" data-q="2018年销售额最高的5个州是哪些？">
              <div class="prompt-card-title">2018年高销大州分析</div>
              <div class="prompt-card-sub">多表关联统计各州总销售额并排序</div>
            </div>
            <div class="prompt-card" data-q="那2017年的呢？">
              <div class="prompt-card-title">多轮追问测试</div>
              <div class="prompt-card-sub">自动消解时间指代，触发 Schema 0ms 复用</div>
            </div>
            <div class="prompt-card" data-q="有效订单中各支付方式的订单量与金额">
              <div class="prompt-card-title">业务口径注入</div>
              <div class="prompt-card-sub">自动剔除取消订单，按有效口径聚合</div>
            </div>
            <div class="prompt-card" data-q="每个优惠券活动带来的有效订单数和商品销售额">
              <div class="prompt-card-title">复杂深层 Join</div>
              <div class="prompt-card-sub">关联优惠券、订单、商品 4+ 张业务表</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部悬浮输入区域 -->
    <div class="input-floating-bar">
      <div class="input-box-wrapper">
        <textarea class="chat-input" id="prompt-input" rows="1"></textarea>
        <button class="send-btn" id="send-button" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- API Key 设置模态弹窗 (BYOK) -->
  <div id="api-key-modal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeApiKeyModal()">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">🔑 DeepSeek API Key 设置 (BYOK)</div>
        <button class="modal-close-btn" id="btn-close-modal" onclick="closeApiKeyModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size:13px; color:#4b5563; line-height:1.6; margin-bottom:14px;">
          为了防止公共服务器资源被滥用或产生超额账单，本系统支持 <b>自带密钥 (BYOK)</b>。<br>
          您的密钥 <b>仅保存在您当前浏览器的本地存储 (localStorage)</b>，发起分析时由请求头实时传递，服务端不存留。
        </p>
        <div style="margin-bottom:12px;">
          <label style="font-size:12px; font-weight:600; color:#374151; display:block; margin-bottom:6px;">DeepSeek API Key (sk-...)</label>
          <input type="password" id="input-api-key" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx" style="width:100%; padding:9px 12px; border:1px solid #d1d5db; border-radius:6px; font-family:monospace; font-size:13px; box-sizing:border-box;">
        </div>
        <div id="modal-tip" style="font-size:12px; color:#dc2626; margin-bottom:12px; display:none;"></div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <button id="btn-clear-key" onclick="clearApiKey()" style="background:transparent; border:0; color:#dc2626; font-size:12px; cursor:pointer; text-decoration:underline;">清除本地 Key</button>
          <div style="display:flex; gap:8px;">
            <button id="btn-cancel-key" onclick="closeApiKeyModal()" style="padding:6px 14px; border:1px solid #d1d5db; background:#fff; border-radius:6px; font-size:13px; cursor:pointer;">取消</button>
            <button id="btn-save-key" onclick="saveApiKey()" style="padding:6px 16px; border:0; background:#10a37f; color:#fff; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer;">保存设置</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const scroller = $('chat-scroller');
    const messages = $('chat-messages');
    const emptyState = $('empty-state');
    const input = $('prompt-input');
    const sendBtn = $('send-button');
    const sessionTitle = $('session-title-label');

    function createSessionId() {
      return 'sess_' + Math.random().toString(36).substring(2, 8) + '_' + Date.now().toString().slice(-4);
    }

    // 本地会话持久化与状态管理
    const SESSIONS_STORAGE_KEY = 'text2sql_agent_sessions_store_v2';

    function loadStoredSessions() {
      try {
        const raw = localStorage.getItem(SESSIONS_STORAGE_KEY);
        if (raw) {
          const list = JSON.parse(raw);
          if (Array.isArray(list) && list.length > 0) return list;
        }
      } catch (e) {}
      return [];
    }

    function saveStoredSessions() {
      try {
        localStorage.setItem(SESSIONS_STORAGE_KEY, JSON.stringify(sessions));
      } catch (e) {}
    }

    let sessions = loadStoredSessions();
    let currentSession = null;

    if (sessions.length === 0) {
      currentSession = {
        id: createSessionId(),
        title: '新会话',
        turnCount: 0,
        status: 'ACTIVE',
        updatedAt: Date.now(),
        turns: []
      };
      sessions.push(currentSession);
      saveStoredSessions();
    } else {
      currentSession = sessions[0];
    }

    sessionTitle.textContent = currentSession.title || '新会话';

    function renderSidebar() {
      const container = $('session-items-container');
      if (!container) return;
      container.innerHTML = '';
      const badge = $('session-count-badge');
      if (badge) badge.textContent = sessions.length + ' 个会话';

      sessions.forEach(s => {
        const item = document.createElement('div');
        const isActive = s.id === currentSession.id;
        item.className = 'session-item' + (isActive ? ' active' : '');
        item.innerHTML = `
          <div class="session-item-content" title="${esc(s.title || '新会话')}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="session-item-title">${esc(s.title || '新会话')}</span>
            ${s.status === 'CLOSED' ? '<span class="session-badge session-badge-persisted">已入库</span>' : (s.turnCount ? `<span class="session-badge">${s.turnCount}轮</span>` : '')}
          </div>
          <button class="session-del-btn" title="删除此会话" data-id="${s.id}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        `;

        item.querySelector('.session-item-content').addEventListener('click', () => {
          switchSession(s.id);
        });

        item.querySelector('.session-del-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          deleteSession(s.id);
        });

        container.appendChild(item);
      });
    }

    function switchSession(sessionId) {
      const found = sessions.find(s => s.id === sessionId);
      if (!found) return;
      currentSession = found;
      sessionTitle.textContent = currentSession.title || '新会话';
      renderSidebar();
      renderCurrentSessionChat();
    }

    function deleteSession(sessionId) {
      if (!confirm('确定删除该历史会话吗？')) return;
      fetch('/api/session/' + sessionId, { method: 'DELETE' }).catch(()=>{});
      sessions = sessions.filter(s => s.id !== sessionId);
      if (sessions.length === 0) {
        currentSession = {
          id: createSessionId(),
          title: '新会话',
          turnCount: 0,
          status: 'ACTIVE',
          updatedAt: Date.now(),
          turns: []
        };
        sessions.push(currentSession);
      } else if (currentSession.id === sessionId) {
        currentSession = sessions[0];
      }
      saveStoredSessions();
      switchSession(currentSession.id);
    }

    function renderCurrentSessionChat() {
      messages.innerHTML = '';
      if (!currentSession.turns || currentSession.turns.length === 0) {
        messages.appendChild(emptyState);
        return;
      }
      currentSession.turns.forEach(t => {
        if (t.role === 'user') {
          appendUserBubble(t.text);
        } else if (t.role === 'agent') {
          appendAgentBubble(t.data);
        }
      });
      scrollToBottom();
    }

    // 监听输入
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 180) + 'px';
      sendBtn.disabled = !input.value.trim();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (input.value.trim()) sendMessage(input.value.trim());
      }
    });

    sendBtn.addEventListener('click', () => {
      if (input.value.trim()) sendMessage(input.value.trim());
    });

    // 快捷卡片点击
    document.querySelectorAll('.prompt-card').forEach(c => {
      c.addEventListener('click', () => sendMessage(c.dataset.q));
    });

    $('btn-new').addEventListener('click', () => {
      // 若当前会话已有问答且尚未结束，开启新会话时自动将旧会话落库
      if (currentSession && currentSession.turns && currentSession.turns.length > 0 && currentSession.status !== 'CLOSED') {
        const oldId = currentSession.id;
        currentSession.status = 'CLOSED';
        fetch(`/api/session/${oldId}/close`, { method: 'POST' }).catch(() => {});
      }

      const newSess = {
        id: createSessionId(),
        title: '新会话',
        turnCount: 0,
        status: 'ACTIVE',
        updatedAt: Date.now(),
        turns: []
      };
      sessions.unshift(newSess);
      saveStoredSessions();
      switchSession(newSess.id);
    });

      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function translateColumn(col) {
      if (!col) return '';
      const clean = col.toLowerCase().trim().replace(/^_+|_+$/g, '');
      if (COLUMN_DICT[clean]) return COLUMN_DICT[clean];

      // 前缀组合分析 (sum_, total_, avg_, min_, max_, count_)
      const prefixRules = [
        { pre: ['sum_', 'total_'], zh: '总' },
        { pre: ['avg_', 'average_'], zh: '平均' },
        { pre: ['max_'], zh: '最高' },
        { pre: ['min_'], zh: '最低' },
        { pre: ['count_'], suffix: '数量' }
      ];

      for (const rule of prefixRules) {
        for (const p of rule.pre) {
          if (clean.startsWith(p)) {
            const base = clean.substring(p.length);
            if (COLUMN_DICT[base]) {
              return rule.zh ? (rule.zh + COLUMN_DICT[base]) : (COLUMN_DICT[base] + rule.suffix);
            }
          }
        }
      }

      // 关键词推断
      if (clean.includes('state')) return '所在州';
      if (clean.includes('city')) return '所在城市';
      if (clean.includes('sales') || clean.includes('amount') || clean.includes('revenue')) return '总销售额 (R$)';
      if (clean.includes('price')) return '金额 (R$)';
      if (clean.includes('freight')) return '运费 (R$)';
      if (clean.includes('count') || clean.includes('cnt')) return '数量';
      if (clean.includes('rate') || clean.includes('ratio')) return '比率';
      if (clean.includes('score')) return '评分';
      if (clean.includes('category')) return '商品类目';
      if (clean.includes('date') || clean.includes('time')) return '日期时间';
      if (clean.includes('user') || clean.includes('customer')) return '客户人数';
      if (clean.includes('order')) return '订单数';

      return col;
    }



    function appendAgentBubble(d) {
      const loading = $('loading-row');
      if (loading) loading.remove();

      const row = document.createElement('div');
      row.className = 'msg-row';

      let inner = `
        <div class="agent-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
        <div class="agent-content">
      `;

      // 追问补全提示
      if (d.rewrittenQuestion && d.rewrittenQuestion !== d.question) {
        inner += `<div class="intent-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span>多轮意图补全：<b>${esc(d.rewrittenQuestion)}</b></span></div>`;
      }

      const isOk = d.status === 'SUCCESS';

      // 开发者标签 (在开发模式下显示技术状态)
      inner += '<div class="dev-only" style="margin-bottom: 8px;">';
      inner += '<div class="status-capsules">';
      inner += `<span class="capsule ${isOk ? 'capsule-success' : 'capsule-err'}">${esc(d.status)}</span>`;
      if (d.schemaReused) inner += '<span class="capsule capsule-reused">Schema 0ms 复用</span>';
      if (d.rewritten) inner += '<span class="capsule capsule-limit">校验器补 LIMIT</span>';
      inner += '</div></div>';

      // 异常拦截提示
      if (!isOk) {
        let friendlyReason = d.message || '';
        if (d.status === 'NOT_CONFIGURED') {
          friendlyReason = '未配置 API Key：请点击右上角【配置 API Key】输入您的 DeepSeek 密钥即可开始使用。';
        } else if (d.status === 'REJECTED') {
          if (friendlyReason.includes('UNKNOWN_TABLE')) {
            friendlyReason = '安全护栏拦截：当前数据库表正在同步或暂未就绪，请刷新重试。';
          } else {
            friendlyReason = '安全护栏拦截：' + friendlyReason;
          }
        }
        inner += `
          <div style="background: #fef2f2; border: 1px solid #fee2e2; border-radius: 8px; padding: 12px 16px; color: #991b1b; margin: 8px 0 12px; font-size: 13px; line-height: 1.5;">
            <div style="font-weight: 600; margin-bottom: 4px;">无法完成数据查询</div>
            <div>${esc(friendlyReason)}</div>
          </div>
        `;
      }

      // 业务数据表格（中文列名）
      if (isOk && d.columns && d.columns.length) {
        const head = d.columns.map(c => `<th>${esc(translateColumn(c))}</th>`).join('');
        const rows = (d.rows || []).slice(0, 50).map(r =>
          `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`
        ).join('');
        inner += `
          <div style="font-size: 14px; color: #334155; margin: 6px 0 8px; font-weight: 500;">
            为您查询到以下业务数据（共 ${(d.rows||[]).length} 条）：
          </div>
          <div class="result-table-wrap">
            <table class="data-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>
          </div>
        `;
      } else if (isOk) {
        inner += `<div style="font-size: 14px; color: #64748b; margin: 6px 0;">已执行完成，暂无符合条件的数据记录。</div>`;
      }

      // 底层 SQL 语句（默认隐藏，仅在右上角开启「开发者模式」时展示）
      if (d.sql) {
        inner += `
          <div class="dev-only" style="margin-top: 10px;">
            <details class="sql-toggle">
              <summary style="cursor: pointer; font-size: 12px; color: #64748b; padding: 4px 0; user-select: none;">
                <span>底层生成的 SQL 语句 (AST 校验通过)</span>
              </summary>
              <div class="sql-card" style="margin-top: 8px;">
                <div class="sql-card-header">
                  <span>PostgreSQL</span>
                  <button class="copy-btn" onclick="navigator.clipboard.writeText(this.closest('.sql-card').querySelector('code').innerText); this.innerHTML='已复制!'; setTimeout(()=>this.innerHTML='复制',1500);">复制</button>
                </div>
                <div class="sql-card-body"><code>${esc(d.sql)}</code></div>
              </div>
            </details>
          </div>
        `;
      }

      // 链路诊断卡片（仅在开发者模式展示）
      const t = d.timings || {};
      const llm = d.llm || {};
      const tables = d.retrievedTables || [];
      inner += `
        <div class="dev-only" style="margin-top: 8px;">
          <details class="trace-card">
            <summary>链路耗时与 Token 统计</summary>
            <div class="trace-grid">
              <div class="trace-item"><b>命中表:</b> ${tables.length ? esc(tables.join(', ')) : '-'}</div>
              <div class="trace-item"><b>模型:</b> ${esc(llm.model || '-')}</div>
              <div class="trace-item"><b>Token:</b> 输入 ${llm.promptTokens || 0} / 输出 ${llm.completionTokens || 0}</div>
              <div class="trace-item"><b>耗时拆解:</b> 检索 ${t.retrievalMs||0}ms · 生成 ${t.generationMs||0}ms · 执行 ${t.executionMs||0}ms</div>
              <div class="trace-item"><b>总响应耗时:</b> ${t.totalMs || 0} ms</div>
            </div>
          </details>
        </div>
      `;

      inner += `</div>`;
      row.innerHTML = inner;
      messages.appendChild(row);
      scrollToBottom();
    }

    function scrollToBottom() {
      scroller.scrollTop = scroller.scrollHeight;
    }

    function appendAgentMessage(d) {
      appendAgentBubble(d);
    }

    // BYOK (自带密钥) 弹窗与本地存储管理
    function updateKeyIndicator() {
      const storedKey = (localStorage.getItem('text2sql_api_key') || '').trim();
      const keyDot = $('key-dot');
      const keyBadgeText = $('key-badge-text');
      if (storedKey) {
        if (keyDot) keyDot.className = 'key-indicator-dot active';
        if (keyBadgeText) {
          const masked = storedKey.length > 10 ? storedKey.slice(0, 6) + '...' + storedKey.slice(-4) : '已配置';
          keyBadgeText.textContent = masked;
        }
      } else {
        if (keyDot) keyDot.className = 'key-indicator-dot warning';
        if (keyBadgeText) keyBadgeText.textContent = '配置 API Key';
      }
    }

    function openApiKeyModal(tip) {
      const modal = $('api-key-modal');
      const input = $('input-api-key');
      const tipEl = $('modal-tip');
      if (!modal) return;
      if (input) input.value = localStorage.getItem('text2sql_api_key') || '';
      if (tipEl) {
        tipEl.textContent = tip || '';
        tipEl.style.display = tip ? 'block' : 'none';
      }
      modal.style.display = 'flex';
      setTimeout(() => input?.focus(), 50);
    }

    function closeApiKeyModal() {
      const modal = $('api-key-modal');
      if (modal) modal.style.display = 'none';
    }

    function saveApiKey() {
      const input = $('input-api-key');
      const tipEl = $('modal-tip');
      const val = (input?.value || '').trim();
      if (!val) {
        if (tipEl) {
          tipEl.textContent = 'Key 不能为空，若要清除请点击左侧「清除本地 Key」';
          tipEl.style.display = 'block';
        }
        return;
      }
      localStorage.setItem('text2sql_api_key', val);
      updateKeyIndicator();
      closeApiKeyModal();
    }

    function clearApiKey() {
      localStorage.removeItem('text2sql_api_key');
      const input = $('input-api-key');
      if (input) input.value = '';
      updateKeyIndicator();
      closeApiKeyModal();
    }

    window.openApiKeyModal = openApiKeyModal;
    window.closeApiKeyModal = closeApiKeyModal;
    window.saveApiKey = saveApiKey;
    window.clearApiKey = clearApiKey;

    async function sendMessage(text) {
      if (!text || !text.trim()) return;

      const storedKey = (localStorage.getItem('text2sql_api_key') || '').trim();
      if (!storedKey) {
        openApiKeyModal('💡 请先输入您的个人 DeepSeek API Key 才能向 Agent 发起提问。');
        return;
      }

      currentSession.turns = currentSession.turns || [];
      currentSession.turns.push({ role: 'user', text: text });
      if (!currentSession.title || currentSession.title === '新会话') {
        currentSession.title = text.slice(0, 22) + (text.length > 22 ? '...' : '');
        sessionTitle.textContent = currentSession.title;
      }
      currentSession.turnCount = (currentSession.turnCount || 0) + 1;
      currentSession.updatedAt = Date.now();
      saveStoredSessions();
      renderSidebar();

      appendUserBubble(text);
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      appendLoading();

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (storedKey) {
          headers['X-Api-Key'] = storedKey;
        }

        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({
            question: text,
            sessionId: currentSession.id,
            apiKey: storedKey
          })
        });
        const data = await res.json();

        if (res.status === 503 || data.status === 'NOT_CONFIGURED') {
          openApiKeyModal('服务端提示：API Key 未配置或无效，请重新检查输入。');
        }

        currentSession.turns.push({ role: 'agent', data: data });
        currentSession.updatedAt = Date.now();
        saveStoredSessions();
        renderSidebar();
        appendAgentBubble(data);
      } catch (err) {
        const errData = { status: 'NETWORK_ERROR', message: err.message };
        currentSession.turns.push({ role: 'agent', data: errData });
        saveStoredSessions();
        renderSidebar();
        appendAgentBubble(errData);
      } finally {
        sendBtn.disabled = !input.value.trim();
        input.focus();
      }
    }

    // 初始化渲染侧边栏、当前对话记录及 Key 状态
    updateKeyIndicator();
    renderSidebar();
    renderCurrentSessionChat();
  </script>
