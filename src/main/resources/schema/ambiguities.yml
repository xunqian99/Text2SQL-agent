# ============================================================================
# 歧义词表（阶段 5：主动反问）
#
# 为什么需要它：
#   有些问题**没有唯一正确答案**，取决于业务口径。例如「销售额」到底含不含运费，
#   两种算法在同一个库里都能跑出结果，差 16% 左右。此时模型的正确行为不是猜一个，
#   而是把选择权交还给提问的人——猜错的话，SQL 语法完全正确、数字看起来很合理，
#   这种错误在业务侧最贵。
#
# 和 metrics.yml 的分工：
#   metrics.yml 回答「口径已经定了，该怎么算」——用于**已经确认过**的定义。
#   ambiguities.yml 回答「口径还没定，该问什么」——用于**故意不替用户决定**的场景。
#   同一个词不能两边都出现：能问清的就问，决定不了才登记歧义。
#
# 命中规则：
#   问题里出现 term，且**没有**出现 hints 里的任何一个限定词 → 触发反问。
#   用户补一句「不含运费的销售额」之后就带上了 hints，于是不再反问，正常生成 SQL。
# ============================================================================

ambiguities:
  - term: 销售额
    hints: [含运费, 不含运费, GMV, 商品金额]
    question: 「销售额」有两种常见口径：含运费的 GMV，还是不含运费的商品金额？请确认一种。

  - term: 活跃用户
    hints: [下单, 登录, 有订单, 访问]
    question: 「活跃用户」按什么口径算？按当月有下单，还是按当月有登录？本数据集只有下单时间可用。

  - term: 复购率
    hints: [两次及以上, 分母, 注册满, 有效订单]
    question: 「复购率」的分母是全部下单用户，还是注册满一定天数的用户？两者差异很大，请确认。
