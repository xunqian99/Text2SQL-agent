- id: T1-002
  difficulty: single_table_basic
  question: 2018 年下单的订单有多少笔？
  sql: "SELECT COUNT(*) FROM orders\nWHERE order_purchase_timestamp >= '2018-01-01'\n\
    \  AND order_purchase_timestamp < '2019-01-01';"
- id: T1-004
  difficulty: single_table_basic
  question: 一共有多少个不同的客户（按自然人统计，同一人多次下单只算一个）？
  sql: SELECT COUNT(DISTINCT customer_unique_id) FROM customers;
- id: T1-006
  difficulty: single_table_basic
  question: 商品表里有多少个商品？
  sql: SELECT COUNT(*) FROM products;
- id: T1-008
  difficulty: single_table_basic
  question: 客户分布在多少个不同的城市？
  sql: SELECT COUNT(DISTINCT customer_city) FROM customers;
- id: T1-011
  difficulty: single_table_basic
  question: 商品类目一共有多少个？
  sql: SELECT COUNT(DISTINCT product_category_name) FROM products;
- id: T2-001
  difficulty: single_table_agg
  question: 所有订单明细的商品金额加起来一共是多少？
  sql: SELECT SUM(price) FROM order_items;
- id: T2-003
  difficulty: single_table_agg
  question: 订单明细的平均商品价格是多少？
  sql: SELECT ROUND(AVG(price), 2) FROM order_items;
- id: T2-005
  difficulty: single_table_agg
  question: 每种订单状态各有多少笔订单？按数量从多到少排列。
  sql: 'SELECT order_status, COUNT(*) AS cnt

    FROM orders GROUP BY order_status ORDER BY cnt DESC;'
- id: T2-007
  difficulty: single_table_agg
  question: 每个评价分数各有多少条评价？
  sql: 'SELECT review_score, COUNT(*) AS cnt

    FROM order_reviews GROUP BY review_score ORDER BY review_score;'
- id: T2-009
  difficulty: single_table_agg
  question: 商品数量最多的 10 个类目是哪些？
  sql: 'SELECT product_category_name, COUNT(*) AS cnt

    FROM products

    WHERE product_category_name IS NOT NULL

    GROUP BY product_category_name ORDER BY cnt DESC LIMIT 10;'
- id: T3-002
  difficulty: time_window
  question: 2017 年和 2018 年各有多少笔订单？
  sql: 'SELECT EXTRACT(YEAR FROM order_purchase_timestamp)::INT AS yr, COUNT(*) AS
    cnt

    FROM orders

    WHERE EXTRACT(YEAR FROM order_purchase_timestamp) IN (2017, 2018)

    GROUP BY 1 ORDER BY 1;'
- id: T3-004
  difficulty: time_window
  question: 2017 年 11 月的订单有多少笔？
  sql: "SELECT COUNT(*) FROM orders\nWHERE order_purchase_timestamp >= '2017-11-01'\n\
    \  AND order_purchase_timestamp < '2017-12-01';"
- id: T3-006
  difficulty: time_window
  question: 每个月的商品销售额是多少？
  sql: "SELECT DATE_TRUNC('month', o.order_purchase_timestamp) AS month,\n       ROUND(SUM(oi.price),\
    \ 2) AS sales\nFROM orders o JOIN order_items oi ON oi.order_id = o.order_id\n\
    GROUP BY 1 ORDER BY 1;"
- id: T3-008
  difficulty: time_window
  question: 每个月的平均订单金额（按订单明细商品金额计）是多少？
  sql: "SELECT DATE_TRUNC('month', o.order_purchase_timestamp) AS month,\n       ROUND(SUM(oi.price)\
    \ / COUNT(DISTINCT o.order_id), 2) AS avg_order_value\nFROM orders o JOIN order_items\
    \ oi ON oi.order_id = o.order_id\nGROUP BY 1 ORDER BY 1;"
- id: T3-011
  difficulty: time_window
  question: 每个月的订单量环比增长率是多少？
  sql: "WITH monthly AS (\n  SELECT DATE_TRUNC('month', order_purchase_timestamp)\
    \ AS m, COUNT(*) AS cnt\n  FROM orders GROUP BY 1\n)\nSELECT m AS month,\n   \
    \    cnt,\n       ROUND((cnt - LAG(cnt) OVER (ORDER BY m))::NUMERIC\n        \
    \     / NULLIF(LAG(cnt) OVER (ORDER BY m), 0), 4) AS mom_rate\nFROM monthly ORDER\
    \ BY m;"
- id: T4-001
  difficulty: multi_join
  question: 每个客户的订单数量是多少？取订单最多的 10 个客户。
  sql: 'SELECT c.customer_unique_id, COUNT(*) AS cnt

    FROM orders o JOIN customers c ON c.customer_id = o.customer_id

    GROUP BY 1 ORDER BY cnt DESC LIMIT 10;'
- id: T4-003
  difficulty: multi_join
  question: 每个商品类目的订单数量是多少？
  sql: 'SELECT p.product_category_name, COUNT(DISTINCT oi.order_id) AS order_cnt

    FROM order_items oi JOIN products p ON p.product_id = oi.product_id

    WHERE p.product_category_name IS NOT NULL

    GROUP BY 1 ORDER BY order_cnt DESC;'
- id: T4-005
  difficulty: multi_join
  question: 每个卖家的订单数量是多少？取前 10 名。
  sql: 'SELECT oi.seller_id, COUNT(DISTINCT oi.order_id) AS order_cnt

    FROM order_items oi GROUP BY 1 ORDER BY order_cnt DESC LIMIT 10;'
- id: T4-007
  difficulty: multi_join
  question: 有多少个商品从来没有发生过价格变动？
  sql: 'SELECT COUNT(*)

    FROM products p

    LEFT JOIN product_price_history h ON h.product_id = p.product_id

    WHERE h.product_id IS NULL;'
- id: T4-009
  difficulty: multi_join
  question: 每个支付方式的平均支付金额是多少？
  sql: 'SELECT payment_type, ROUND(AVG(payment_value), 2) AS avg_value

    FROM order_payments WHERE payment_type IS NOT NULL

    GROUP BY 1 ORDER BY avg_value DESC;'
- id: T4-010
  difficulty: multi_join
  question: 每个订单状态的商品销售总额是多少？
  sql: 'SELECT o.order_status, ROUND(SUM(oi.price), 2) AS sales

    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id

    GROUP BY 1 ORDER BY sales DESC;'
- id: T4-012
  difficulty: multi_join
  question: 每个州的评价平均分是多少？取评价数最多的 10 个州。
  sql: 'SELECT c.customer_state, ROUND(AVG(r.review_score), 2) AS avg_score, COUNT(*)
    AS cnt

    FROM order_reviews r

    JOIN orders o ON o.order_id = r.order_id

    JOIN customers c ON c.customer_id = o.customer_id

    GROUP BY 1 ORDER BY cnt DESC LIMIT 10;'
- id: T4-014
  difficulty: multi_join
  question: 每种支付方式的评价平均分是多少？
  sql: 'SELECT p.payment_type, ROUND(AVG(r.review_score), 2) AS avg_score

    FROM order_payments p

    JOIN order_reviews r ON r.order_id = p.order_id

    GROUP BY 1 ORDER BY avg_score DESC;'
- id: T5-002
  difficulty: multi_join_deep
  question: 每个会员等级对应的商品销售额是多少？
  sql: 'SELECT ml.level_name, ROUND(SUM(oi.price), 2) AS sales

    FROM orders o

    JOIN customers c ON c.customer_id = o.customer_id

    JOIN members m ON m.customer_unique_id = c.customer_unique_id

    JOIN member_levels ml ON ml.level_id = m.level_id

    JOIN order_items oi ON oi.order_id = o.order_id

    GROUP BY 1 ORDER BY sales DESC;'
- id: T5-004
  difficulty: multi_join_deep
  question: 每个仓库所在区域的发货单量和覆盖订单数分别是多少？
  sql: 'SELECT r.region_name, COUNT(DISTINCT s.shipment_id) AS shipments, COUNT(DISTINCT
    o.order_id) AS orders

    FROM shipments s

    JOIN warehouses w ON w.warehouse_id = s.warehouse_id

    JOIN regions r ON r.region_code = w.region_code

    JOIN orders o ON o.order_id = s.order_id

    JOIN customers c ON c.customer_id = o.customer_id

    GROUP BY 1 ORDER BY shipments DESC;'
- id: T5-006
  difficulty: multi_join_deep
  question: 物流延迟类工单按客户所在州和会员等级分布，列出前 20 组。
  sql: 'SELECT c.customer_state, ml.level_name, COUNT(DISTINCT st.ticket_id) AS tickets

    FROM support_tickets st

    JOIN ticket_categories tc ON tc.category_id = st.category_id

    JOIN orders o ON o.order_id = st.order_id

    JOIN customers c ON c.customer_id = o.customer_id

    JOIN members m ON m.member_id = st.member_id

    JOIN member_levels ml ON ml.level_id = m.level_id

    WHERE tc.category_name = ''物流延迟''

    GROUP BY 1, 2 ORDER BY tickets DESC LIMIT 20;'
- id: T5-008
  difficulty: multi_join_deep
  question: 按推荐人和被推荐人的会员等级组合统计推荐关系数量和奖励金额。
  sql: "SELECT mlr.level_name AS referrer_level, mli.level_name AS invitee_level,\n\
    \       COUNT(*) AS referrals, ROUND(SUM(rf.reward_amount), 2) AS reward\nFROM\
    \ referrals rf\nJOIN members mr ON mr.member_id = rf.referrer_member_id\nJOIN\
    \ member_levels mlr ON mlr.level_id = mr.level_id\nJOIN members mi ON mi.member_id\
    \ = rf.invitee_member_id\nJOIN member_levels mli ON mli.level_id = mi.level_id\n\
    GROUP BY 1, 2 ORDER BY referrals DESC;"
- id: T5-011
  difficulty: multi_join_deep
  question: 品牌销售额排名前 10 是哪些？销售额按商品金额统计。
  sql: 'SELECT b.brand_name, ROUND(SUM(oi.price), 2) AS sales

    FROM order_items oi

    JOIN product_brand_map pbm ON pbm.product_id = oi.product_id AND pbm.is_current

    JOIN brands b ON b.brand_id = pbm.brand_id

    JOIN orders o ON o.order_id = oi.order_id

    JOIN customers c ON c.customer_id = o.customer_id

    GROUP BY 1 ORDER BY sales DESC LIMIT 10;'
- id: T5-013
  difficulty: multi_join_deep
  question: 每个营销活动关联商品实际带来的订单数和销售额，取前 10。
  sql: 'SELECT ca.campaign_name, COUNT(DISTINCT oi.order_id) AS orders, ROUND(SUM(oi.price),
    2) AS gmv

    FROM campaign_products cp

    JOIN campaigns ca ON ca.campaign_id = cp.campaign_id

    JOIN order_items oi ON oi.product_id = cp.product_id

    JOIN orders o ON o.order_id = oi.order_id

    JOIN customers c ON c.customer_id = o.customer_id

    GROUP BY 1 ORDER BY gmv DESC LIMIT 10;'
- id: T6-001
  difficulty: business_semantics
  question: 统计 2018 年全站 GMV（含运费），以及不含运费的销售额，两者分别是多少？
  sql: "SELECT ROUND(SUM(oi.price + oi.freight_value), 2) AS gmv_with_freight,\n \
    \      ROUND(SUM(oi.price), 2) AS sales_without_freight\nFROM orders o\nJOIN order_items\
    \ oi ON oi.order_id = o.order_id\nWHERE o.order_status NOT IN ('canceled', 'unavailable')\n\
    \  AND o.order_purchase_timestamp >= DATE '2018-01-01'\n  AND o.order_purchase_timestamp\
    \ < DATE '2019-01-01';"
- id: T6-003
  difficulty: business_semantics
  question: 复购率是多少？（下单 2 次及以上的用户占全部下单用户的比例）
  sql: "WITH per_user AS (\n  SELECT c.customer_unique_id, COUNT(DISTINCT o.order_id)\
    \ AS order_cnt\n  FROM orders o\n  JOIN customers c ON c.customer_id = o.customer_id\n\
    \  WHERE o.order_status NOT IN ('canceled', 'unavailable')\n  GROUP BY 1\n)\n\
    SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE order_cnt >= 2) / COUNT(*), 2) AS\
    \ repeat_rate_pct\nFROM per_user;"
- id: T6-005
  difficulty: business_semantics
  question: 会员用户贡献的订单占比是多少？（会员渗透率）
  sql: "WITH member_orders AS (\n  SELECT COUNT(DISTINCT o.order_id) AS n\n  FROM\
    \ orders o\n  JOIN customers c ON c.customer_id = o.customer_id\n  JOIN members\
    \ m ON m.customer_unique_id = c.customer_unique_id\n  WHERE o.order_status NOT\
    \ IN ('canceled', 'unavailable')\n),\nall_orders AS (\n  SELECT COUNT(DISTINCT\
    \ o.order_id) AS n\n  FROM orders o\n  WHERE o.order_status NOT IN ('canceled',\
    \ 'unavailable')\n)\nSELECT ROUND(100.0 * mo.n / ao.n, 2) AS penetration_pct\n\
    FROM member_orders mo CROSS JOIN all_orders ao;"
- id: T6-007
  difficulty: business_semantics
  question: 退款率是多少？（退款订单数 / 有效订单数）
  sql: "WITH r AS (\n  SELECT COUNT(DISTINCT r.order_id) AS n FROM refunds r\n  JOIN\
    \ orders o ON o.order_id = r.order_id\n  WHERE o.order_status NOT IN ('canceled',\
    \ 'unavailable')\n),\na AS (\n  SELECT COUNT(DISTINCT o.order_id) AS n FROM orders\
    \ o\n  WHERE o.order_status NOT IN ('canceled', 'unavailable')\n)\nSELECT ROUND(100.0\
    \ * r.n / a.n, 2) AS refund_rate_pct\nFROM r CROSS JOIN a;"
- id: T6-009
  difficulty: business_semantics
  question: 低分订单（1-2 星）占比是多少？按客户所在州列出前 10。
  sql: "SELECT c.customer_state,\n       ROUND(100.0 * COUNT(*) FILTER (WHERE r.review_score\
    \ <= 2) / COUNT(*), 2) AS low_pct\nFROM order_reviews r\nJOIN orders o ON o.order_id\
    \ = r.order_id\nJOIN customers c ON c.customer_id = o.customer_id\nWHERE o.order_status\
    \ NOT IN ('canceled', 'unavailable')\nGROUP BY 1 ORDER BY low_pct DESC LIMIT 10;"
- id: T6-010
  difficulty: business_semantics
  question: 搜索转化率是多少？（有点击的搜索记录 / 全部搜索记录）
  sql: 'SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE clicked_product_id IS NOT NULL)
    / COUNT(*), 2) AS ctr_pct

    FROM search_logs;'
