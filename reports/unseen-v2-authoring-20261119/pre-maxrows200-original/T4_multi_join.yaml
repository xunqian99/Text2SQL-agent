    "gold_sql": "SELECT c.campaign_id,c.campaign_name,COUNT(*) AS item_rows,SUM(oi.price) AS product_amount FROM campaigns c JOIN campaign_products cp ON cp.campaign_id=c.campaign_id JOIN order_items oi ON oi.product_id=cp.product_id JOIN orders o ON o.order_id=oi.order_id WHERE c.start_date>='2018-01-01' AND c.start_date<'2019-01-01' AND c.end_date IS NOT NULL AND o.order_status NOT IN ('canceled','unavailable') AND o.order_purchase_timestamp>=c.start_date AND o.order_purchase_timestamp<c.end_date+INTERVAL '1 day' GROUP BY c.campaign_id,c.campaign_name ORDER BY c.campaign_id;",
