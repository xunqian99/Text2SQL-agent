    ],
    "question": "列出已结算（status=2）且应结净额大于1000的结算单，按净额降序取前30张，并列按结算ID升序。只输出结算ID、卖家ID、账期开始日和应结净额，不重新扣佣金。",
    "gold_sql": "SELECT settlement_id,seller_id,period_start,net_amount FROM settlements WHERE status=2 AND net_amount>1000 ORDER BY net_amount DESC,settlement_id LIMIT 30;",
