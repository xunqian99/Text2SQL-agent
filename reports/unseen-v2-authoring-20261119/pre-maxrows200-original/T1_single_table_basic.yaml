    "gold_sql": "SELECT referral_id,referrer_member_id,invitee_member_id,reward_amount FROM referrals WHERE referrer_member_id IS NOT NULL AND invitee_member_id IS NOT NULL AND converted_at IS NULL AND reward_amount>0 AND created_at IS NOT NULL ORDER BY created_at,referral_id LIMIT 20;",
