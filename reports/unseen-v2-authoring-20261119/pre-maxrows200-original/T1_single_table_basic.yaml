    "question": "在地理坐标表中找出州代码为SC、纬度和经度都已知的不同邮编前缀，按邮编前缀升序取前40个；邮编前缀未知排除。只输出邮编前缀，不输出或选择某一个坐标点。",
    "gold_sql": "SELECT DISTINCT geolocation_zip_code_prefix FROM geolocation WHERE geolocation_state='SC' AND geolocation_lat IS NOT NULL AND geolocation_lng IS NOT NULL AND geolocation_zip_code_prefix IS NOT NULL ORDER BY geolocation_zip_code_prefix LIMIT 40;",
