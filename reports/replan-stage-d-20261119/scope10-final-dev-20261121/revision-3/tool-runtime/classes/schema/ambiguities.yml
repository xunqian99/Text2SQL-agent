# ============================================================================
# 歧义词表（阶段 5：主动反问）
#
# 为什么需要它：
#   有些问题**没有唯一正确答案**，取决于业务口径。例如「销售额」到底含不含运费，
#   两种算法在同一个库里都能跑出结果，差 16% 左右。此时模型的正确行为不是猜一个，
#   而是把选择权交还给提问的人——猜错的话，SQL 语法完全正确、数字看起来很合理，
#   这种错误在业务侧最贵。
#
# 和 metrics.yml 的分工：
#   metrics.yml 回答「口径已经定了，该怎么算」——用于**已经确认过**的定义。
#   ambiguities.yml 回答「口径还没定，该问什么」——用于**故意不替用户决定**的场景。
#   同一个词不能两边都出现：能问清的就问，决定不了才登记歧义。
#
# 命中规则：
#   旧规则：出现term，且没有出现任何hint → 触发反问。
#   显式规则：term/aliases命中后，requiredEvidence各组都须命中至少一个pattern，
#   unresolvedPatterns任一命中仍须反问。模式启动时编译；未知表达保守反问。
#   可选triggerPatterns仅决定本规则是否适用，不能充当已明确口径的证据。
#   用户补一句「不含运费的销售额」之后就带上了 hints，于是不再反问，正常生成 SQL。
# ============================================================================

ambiguities:
  - term: 销售额
    hints: [含运费, 不含运费, GMV, 商品金额, 商品销售额]
    replyOptions:
      - group: legacy-hint
        replies: [含运费, 按含运费, 含运费的, GMV]
        confirmation: 销售额按含运费的GMV计算
      - group: legacy-hint
        replies: [不含运费, 按不含运费, 不含运费的, 商品金额, 按商品金额]
        confirmation: 销售额按不含运费的商品金额计算
    # 提到候选口径不代表已经选定。沿用现有阻断证据机制，不增加新的判定器。
    unresolvedPatterns:
      - '不(?:确定|清楚|知道|明白)|未(?:确定|明确|确认)|还没(?:定|确定|确认)'
      - '运费.{0,12}(?:还是|或是|或者)|(?:是否|要不要|需不需要).{0,12}运费|运费.{0,8}(?:是否|要不要|需不需要|算不算)'
      - '(?:含|包括|包含|计入|计算|算上)运费(?:的)?(?:吗|么)|(?:含不含|包不包括|计不计|算不算)运费'
    question: 「销售额」有两种常见口径：含运费的 GMV，还是不含运费的商品金额？请确认一种。

  - term: 活跃用户
    hints: [下单, 登录, 有订单, 访问]
    replyOptions:
      - group: legacy-hint
        replies: [下单, 按下单, 当月有下单]
        confirmation: 活跃用户按当月有下单计算
    question: 「活跃用户」按什么口径算？按当月有下单，还是按当月有登录？本数据集只有下单时间可用。

  - term: 复购率
    aliases: [回购率, 重复购买率]
    replyOptions:
      - group: denominator
        replies: [全部下单用户, 以全部下单用户为分母, 分母是全部下单用户]
        confirmation: 复购率以全部下单用户为分母
    # 有requiredEvidence时，不使用“出现任一hint就放行”的旧模式。
    # 这里检查分母，不凭“两次及以上”（分子）或“有效订单”（过滤范围）假装分母已确认。
    requiredEvidence:
      - name: denominator
        patterns:
          - '(?:分母(?:是|为|用|采用|取|选为)?|占|除以|/|÷)(?:(?:全部|所有)(?:下单|下过单|购买|有过有效订单)(?:的)?(?:用户|买家|客户)(?:人数|总数|数)?|有过(?:有效)?订单的(?:全部|所有)(?:用户|买家|客户)|注册满(?:[1-9][0-9]*|[一二三四五六七八九十百]+)(?:天|日|个月|月|年)(?:的)?(?:用户|买家|客户))'
          - '(?:(?:全部|所有)(?:下单|下过单|购买|有过有效订单)(?:的)?(?:用户|买家|客户)(?:人数|总数|数)?|有过(?:有效)?订单的(?:全部|所有)(?:用户|买家|客户)|注册满(?:[1-9][0-9]*|[一二三四五六七八九十百]+)(?:天|日|个月|月|年)(?:的)?(?:用户|买家|客户))(?:作为|作|为)分母'
    unresolvedPatterns:
      - '不(?:确定|清楚|知道|明白)|未(?:确定|明确)|还没(?:定|确定)'
      - '还是|或是|(?:是否|能否|要不要).{0,30}分母|分母.{0,12}(?:怎么|哪个|哪种|是否)'
      - '(?:不以|不用|不按|不要(?:以|用|按)?|不是).{0,40}(?:为分母|作分母|作为分母)|分母(?:不是|不用|不要|不按|不以)'
    question: 「复购率」的分母是全部下单用户，还是注册满一定天数的用户？两者差异很大，请确认。

  - term: 大区
    aliases: [宏观区域, macro_region]
    replyOptions:
      - group: regional-subject
        replies: [客户, 按客户, 客户收货地, 按客户收货地]
        confirmation: 按客户所在大区统计
      - group: regional-subject
        replies: [卖家, 按卖家, 卖家所在地, 按卖家所在地]
        confirmation: 按卖家所在大区统计
      - group: regional-subject
        replies: [仓库, 按仓库, 仓库所在地, 按仓库所在地]
        confirmation: 按仓库所在地统计大区
    # 交易事实有客户/卖家等多条地域来源；纯地区字典、仓库容量和库存统计不套本规则。
    triggerPatterns:
      - '(?:大区|宏观区域|macro_region).{0,40}(?:订单|销售额|gmv|成交|运费|退款)|(?:订单|销售额|gmv|成交|运费|退款).{0,40}(?:大区|宏观区域|macro_region)'
    requiredEvidence:
      - name: regional-subject
        patterns:
          - '(?<!(?:不|不要|不是|别)(?:按|用|以|采用|使用|根据)?)(?:客户|买家|消费者|卖家|商家|仓库)(?:(?:所属|所在|收货|发货|来源|的)){1,2}(?:州|省|地区|大区|宏观区域)'
          - '(?<!(?:不|不要|不是|别)(?:按|用|以|采用|使用|根据)?)(?:按|采用|使用|用|以|根据)(?:客户|买家|消费者|卖家|商家|仓库)(?:(?:所属|所在|收货|发货|来源|的)){0,2}(?:州|省|地区|大区|宏观区域)|(?<!(?:不|不要|不是|别)(?:按|用|以|采用|使用|根据)?)(?:客户|买家|消费者|卖家|商家|仓库)所在地'
          - '(?<!(?:不|不要|不是|别)(?:按|用|以|采用|使用|根据)?)(?:按|采用|使用|以|根据)(?:(?:customers\.)?customer_state|(?:sellers\.)?seller_state)'
          - '(?:大区|宏观区域).{0,6}(?:有多少个客户|有多少位客户|客户人数|客户数)'
    unresolvedPatterns:
      - '(?:客户|买家|卖家|商家)(?:(?:所在|的)?(?:州|大区|宏观区域))?(?:还是|或是|或者)(?:客户|买家|卖家|商家)'
      - '(?:是否|要不要|未确定|不确定|不清楚|不知道).{0,12}(?:客户|卖家|大区|宏观区域)|(?:大区|宏观区域).{0,10}(?:未确定|不确定|不清楚|不知道)'
      - '(?:客户|买家|卖家|商家)(?:所在|的)?(?:州|大区|宏观区域)(?:的)?(?:吗|么|不要用|不用)'
    question: 交易指标按哪一方的地域归属统计大区：客户收货地、卖家所在地，还是仓库所在地？请明确来源。

  - term: 平均涨跌幅
    aliases: [平均涨幅, 平均跌幅]
    replyOptions:
      - group: price-change-unit
        replies: [百分比, 按百分比, 相对涨跌率]
        confirmation: 价格平均涨跌幅按相对涨跌率计算（新价减旧价后除以旧价）
      - group: price-change-unit
        replies: [金额差, 按金额差, 绝对价差, 新价减旧价]
        confirmation: 价格平均涨跌幅按新价减旧价的金额差计算
      - group: averaging-grain
        replies: [每条记录等权, 每条变动记录等权, 按记录, 按变动记录平均]
        confirmation: 每条价格变动记录等权平均
      - group: averaging-grain
        replies: [先按商品平均再按类目平均, 先按商品平均，再按类目平均]
        confirmation: 先按每个商品平均，再按类目平均
      - group: averaging-grain
        replies: [按销量加权, 以销量加权]
        confirmation: 按销量加权平均
    # 只有价格平均值才需要该选择，不拦订单量或库存数量的平均涨幅。
    triggerPatterns:
      - '(?:价格|调价|价差|old_price|new_price).{0,80}(?:平均涨跌幅|平均涨幅|平均跌幅)|(?:平均涨跌幅|平均涨幅|平均跌幅).{0,80}(?:价格|调价|价差|old_price|new_price)'
    requiredEvidence:
      - name: price-change-unit
        patterns:
          - '(?:平均涨跌幅|平均涨幅|平均跌幅)(?:[:,，])?(?:按|用|采用|以)(?:绝对价差|价格差额|金额差|新价减旧价|相对涨跌率|价格变动比例|百分比|百分数)'
          - '(?:平均涨跌幅|平均涨幅|平均跌幅)(?:按|以|用)?(?:百分比|百分数|金额差|绝对价差)(?:输出|计算|统计|表示)'
      - name: averaging-grain
        patterns:
          - '(?<!(?:不|不要|不是|别)(?:按|用|以|采用|使用|根据)?)(?:每条|每次)(?:价格)?变动(?:记录)?(?:等权|权重相同|计一次)'
          - '(?<!(?:不|不要|不是|别)(?:按|用|以|采用|使用|根据)?)按(?:价格)?变动记录(?:平均|等权)'
          - '(?<!不)(?<!不要)先按(?:每个)?商品(?:平均|求平均).{0,12}(?:再|然后).{0,8}(?:平均|汇总)'
          - '(?<!不)(?<!不要)(?:以|按)(?:订单数|销量|销售数量)加权'
    unresolvedPatterns:
      - '(?:还是|或是|或者)(?:按|用|以|采用)?(?:绝对价差|金额差|百分比|百分数|相对涨跌率)'
      - '(?:绝对价差|金额差|百分比|百分数|涨跌率).{0,6}(?:还是|或是|或者)|(?:是否|要不要|未确定|不确定|不清楚).{0,12}(?:平均|价差|金额差|百分比|加权)'
      - '(?:记录|商品|订单数|销量).{0,6}(?:还是|或是|或者).{0,6}(?:记录|商品|订单数|销量)|(?:等权|加权|价差|百分比)(?:的)?(?:吗|么)'
    question: 价格平均涨跌幅按新价减旧价的金额差，还是除以旧价的比例？平均按每条变动记录等权、先按商品平均，还是按销量加权？请明确两项。
