# Full-schema reference, not a claim of offline model inference.
# Gold self-check without a model uses scripts/run_eval.ps1 -Split all -DryRun.
server:
  address: 127.0.0.1

agent:
  eval:
    enabled: false
  retrieval:
    enabled: false
    column-pruning-enabled: false
    join-hints-enabled: false
    join-list-enabled: false
    join-plan-enabled: false
  semantic:
    enabled: false
  fewshot:
    enabled: false
  clarification:
    enabled: false
  self-correction:
    enabled: false
  result-checker:
    enabled: false
  conversation:
    enabled: false
  cache:
    enabled: false
  persistence:
    enabled: false
  tool-use:
    enabled: false
  routing:
    enabled: false
  guard:
    explain-cost-guard-enabled: true
    reject-cartesian-product: true
  request-budget:
    enabled: true
    timeout-ms: 15000
    max-model-calls: 2
    min-retry-remaining-ms: 2000
  observability:
    enabled: true
    include-content: false
