  notes: V3开发参考，题面已明确本题定义。
- id: T4-029
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 按工单关联订单的客户档案所在州统计工单数；全部工单都参与，无法确定州的保留NULL组。
  gold_sql: 'SELECT c.customer_state,COUNT(*) AS cnt FROM support_tickets st LEFT JOIN orders o ON o.order_id=st.order_id
    LEFT JOIN customers c ON c.customer_id=o.customer_id GROUP BY c.customer_state ORDER BY cnt DESC,c.customer_state
    ASC NULLS LAST;

