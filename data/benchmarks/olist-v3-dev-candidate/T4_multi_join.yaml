- id: T4-025
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 按仓库所在宏观大区统计全部仓库的已知容量合计，无法确定大区的仓库保留NULL组。
  gold_sql: 'SELECT r.macro_region,SUM(w.capacity) AS total_capacity

