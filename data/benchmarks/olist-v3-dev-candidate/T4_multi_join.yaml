- id: T4-027
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 按库存记录中出现的仓库ID，统计库存数量总和及每条仓库商品库存记录等权的平均库存量两位；输出仓库ID和两项数量。
  gold_sql: 'SELECT i.warehouse_id,SUM(i.quantity) AS total_qty,ROUND(AVG(i.quantity),2) AS avg_qty FROM inventory
    i GROUP BY i.warehouse_id ORDER BY total_qty DESC NULLS LAST,i.warehouse_id ASC;

