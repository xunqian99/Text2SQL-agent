    '
  notes: V3开发参考，题面已明确本题定义。
- id: T4-032
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 按实际退款明细对应商品的非NULL类目，统计每类目发生过的不同退款单数；同一退款单涉及多个类目时各类目分别计一次。
  gold_sql: 'SELECT p.product_category_name,COUNT(DISTINCT ri.refund_id) AS cnt

    FROM refund_items ri JOIN refunds rf ON rf.refund_id=ri.refund_id AND rf.order_id=ri.order_id

    JOIN order_items oi ON oi.order_id=ri.order_id AND oi.order_item_id=ri.order_item_id

    JOIN products p ON p.product_id=oi.product_id

    WHERE p.product_category_name IS NOT NULL

    GROUP BY p.product_category_name ORDER BY cnt DESC,p.product_category_name ASC;

    '
  notes: V3开发参考，题面已明确本题定义。
- id: T4-034
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 全部订单中有过任意退款记录的订单占比是多少？不排订单状态，按订单去重，输出0到1小数四位，分母为0时NULL。
  gold_sql: 'SELECT ROUND(COUNT(*) FILTER(WHERE EXISTS(SELECT 1 FROM refunds r WHERE r.order_id=o.order_id))::numeric/NULLIF(COUNT(*),0),4)
    AS refund_rate FROM orders o;

    '
  notes: V3开发参考，题面已明确本题定义。
- id: T4-036
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 按订单对应客户档案所在州，统计有商品明细的下单自然人的人均商品金额，不含运费，全部订单状态；同人在各州分别去重。
  gold_sql: "SELECT c.customer_state,\n       ROUND(SUM(oi.price) / COUNT(DISTINCT c.customer_unique_id), 2) AS\
    \ avg_per_customer\nFROM orders o\nJOIN customers c ON c.customer_id = o.customer_id\nJOIN order_items oi ON\
    \ oi.order_id = o.order_id\nGROUP BY 1 ORDER BY avg_per_customer DESC;\n"
  notes: V3开发参考，题面已明确本题定义。
- id: T4-038
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 每个会员等级里有多少人打过"流失风险用户"标签？
  gold_sql: 'SELECT m.level_id, COUNT(DISTINCT m.member_id) AS cnt

    FROM members m

    JOIN user_tag_map tm ON tm.member_id = m.member_id

    JOIN user_tags t ON t.tag_id = tm.tag_id

    WHERE t.tag_code = ''CHURN_RISK''

    GROUP BY 1 ORDER BY 1;

    '
  notes: ''
- id: T4-041
  difficulty: multi_join
  tags:
  - join
  - 分组
  - 求和
  question: 按当前is_current=true的品牌归属，列出所有品牌ID、当前商品数及这些商品全部订单状态下不含运费销售额；无销售金额为NULL，不只取前10。
  gold_sql: 'WITH products_by_brand AS(SELECT b.brand_id,p.product_id FROM brands b LEFT JOIN product_brand_map
    bm ON bm.brand_id=b.brand_id AND bm.is_current IS TRUE LEFT JOIN products p ON p.product_id=bm.product_id) SELECT
    b.brand_id,COUNT(DISTINCT b.product_id) AS product_cnt,ROUND(SUM(oi.price),2) AS sales FROM products_by_brand
    b LEFT JOIN order_items oi ON oi.product_id=b.product_id GROUP BY b.brand_id ORDER BY sales DESC NULLS LAST,b.brand_id
    ASC;

    '
  notes: V3开发参考，题面已明确本题定义。
- id: T4-043
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 按发货状态统计每张发货单等权的平均物流轨迹记录数两位；包括0条轨迹的发货单。
  gold_sql: 'WITH per_shipment AS(SELECT s.shipment_id,s.status,COUNT(t.tracking_id) AS cnt FROM shipments s LEFT
    JOIN shipment_tracking t ON t.shipment_id=s.shipment_id GROUP BY s.shipment_id,s.status) SELECT status,ROUND(AVG(cnt),2)
    AS avg_events FROM per_shipment GROUP BY status ORDER BY status ASC NULLS LAST;

    '
  notes: V3开发参考，题面已明确本题定义。
- id: T4-045
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 按非NULL类目统计已知商品重量平均值两位；按类目全部商品数取前10，同数按类目原值升序，仅输出类目和平均重量。
  gold_sql: 'SELECT product_category_name,ROUND(AVG(product_weight_g),2) AS avg_weight FROM products WHERE product_category_name
    IS NOT NULL GROUP BY product_category_name ORDER BY COUNT(*) DESC,product_category_name ASC LIMIT 10;

    '
  notes: V3开发参考，题面已明确本题定义。
