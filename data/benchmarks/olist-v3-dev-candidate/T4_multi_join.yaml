- id: T4-001
  difficulty: multi_join
  tags:
  - join
  - 计数
  question: 按自然人统计订单数，输出订单最多的10人的自然人ID与订单数，同数按自然人ID升序。
  gold_sql: 'SELECT c.customer_unique_id,COUNT(*) AS cnt FROM orders o JOIN customers c ON c.customer_id=o.customer_id
    GROUP BY c.customer_unique_id ORDER BY cnt DESC,c.customer_unique_id ASC NULLS LAST LIMIT 10;

    '
  notes: V3开发参考，题面已明确本题定义。
- id: T4-003
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 每个商品类目的订单数量是多少？
  gold_sql: 'SELECT p.product_category_name, COUNT(DISTINCT oi.order_id) AS order_cnt

    FROM order_items oi JOIN products p ON p.product_id = oi.product_id

    WHERE p.product_category_name IS NOT NULL

    GROUP BY 1 ORDER BY order_cnt DESC;

    '
  notes: 用 COUNT(DISTINCT order_id) 而不是 COUNT(*)，因为一个订单可能包含同类目多个商品。
- id: T4-005
  difficulty: multi_join
  tags:
  - join
  - 分组
  - 求和
  question: 每个卖家的订单数量是多少？取前 10 名。
  gold_sql: 'SELECT oi.seller_id, COUNT(DISTINCT oi.order_id) AS order_cnt

    FROM order_items oi GROUP BY 1 ORDER BY order_cnt DESC,oi.seller_id ASC LIMIT 10;

    '
  notes: ''
- id: T4-007
  difficulty: multi_join
  tags:
  - join
  - 外连接
  - 计数
  question: 有多少个商品从来没有发生过价格变动？
  gold_sql: 'SELECT COUNT(*)

    FROM products p

    LEFT JOIN product_price_history h ON h.product_id = p.product_id

    WHERE h.product_id IS NULL;

    '
  notes: 必须用 LEFT JOIN + IS NULL 找「没有关联记录」的商品。若写成 INNER JOIN，结果会变成「有过价格变动的商品数」，含义完全相反。
- id: T4-009
  difficulty: multi_join
  tags:
  - join
  - 分组
  - 平均
  question: 按支付方式原值分组，统计每条支付记录等权的平均支付金额，未知方式保留为NULL组，金额两位。
  gold_sql: 'SELECT payment_type,ROUND(AVG(payment_value),2) AS avg_value FROM order_payments GROUP BY payment_type
    ORDER BY avg_value DESC NULLS LAST,payment_type ASC NULLS LAST;

    '
  notes: V3开发参考，题面已明确本题定义。
- id: T4-010
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 按有商品明细的订单状态统计商品金额合计两位，不含运费，不补无明细的状态，不额外排除取消或不可用状态。
  gold_sql: 'SELECT o.order_status, ROUND(SUM(oi.price), 2) AS sales

    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id

    GROUP BY 1 ORDER BY sales DESC;

    '
  notes: V3开发参考，题面已明确本题定义。
- id: T4-012
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 按订单客户档案所在州统计每条评价等权的平均分两位，按评价记录数取前10州，仅输出州和平均分，同数按州升序。
  gold_sql: 'SELECT c.customer_state,ROUND(AVG(r.review_score),2) AS avg_score FROM order_reviews r JOIN orders
    o ON o.order_id=r.order_id JOIN customers c ON c.customer_id=o.customer_id GROUP BY c.customer_state ORDER BY
    COUNT(*) DESC,c.customer_state ASC NULLS LAST LIMIT 10;

    '
  notes: V3开发参考，题面已明确本题定义。
- id: T4-014
  difficulty: multi_join
  tags:
  - join
  - 分组
  question: 每种支付方式的评价平均分是多少（两位）？每条评价在其订单使用的每种支付方式下各计一次，同单同方式多次支付不重复加权评价。
  gold_sql: 'WITH order_types AS(SELECT DISTINCT order_id,payment_type FROM order_payments) SELECT p.payment_type,ROUND(AVG(r.review_score),2)
    AS avg_score FROM order_types p JOIN order_reviews r ON r.order_id=p.order_id GROUP BY p.payment_type ORDER
    BY avg_score DESC NULLS LAST,p.payment_type ASC NULLS LAST;

    '
  notes: V3开发参考，题面已明确本题定义。
- id: T4-016
  difficulty: multi_join
  tags:
  - join
  - 分组
  - 求和
  question: 按订单对应客户档案的customer_state映射大区，统计各客户所在大区不含运费的商品销售额，包含全部订单状态。
  gold_sql: 'SELECT r.macro_region,ROUND(SUM(oi.price),2) AS sales

    FROM order_items oi JOIN orders o ON o.order_id=oi.order_id

    LEFT JOIN customers c ON c.customer_id=o.customer_id

    LEFT JOIN regions r ON r.region_code=c.customer_state

    GROUP BY r.macro_region ORDER BY sales DESC NULLS LAST,r.macro_region ASC NULLS LAST;

    '
  notes: V3开发参考，题面已明确本题定义。
- id: T4-018
  difficulty: multi_join
  tags:
  - join
  - 分组
  - 求和
  question: 按当前会员等级ID统计这些会员全部订单状态下的商品金额合计，不含运费或支付金额，输出等级ID和金额两位。
  gold_sql: 'SELECT m.level_id, ROUND(SUM(oi.price), 2) AS sales

    FROM orders o

    JOIN customers c ON c.customer_id = o.customer_id

    JOIN members m ON m.customer_unique_id = c.customer_unique_id

    JOIN order_items oi ON oi.order_id = o.order_id

    GROUP BY 1 ORDER BY 1;

    '
  notes: V3开发参考，题面已明确本题定义。
- id: T4-021
  difficulty: multi_join
  tags:
