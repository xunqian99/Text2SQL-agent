- id: T2-005
  difficulty: single_table_agg
  tags:
  - 聚合
  - 分组
  question: 每种订单状态各有多少笔订单？按数量从多到少排列。
  gold_sql: 'SELECT order_status, COUNT(*) AS cnt

    FROM orders GROUP BY order_status ORDER BY cnt DESC;

    '
  notes: ''
- id: T2-007
  difficulty: single_table_agg
  tags:
  - 聚合
  - 分组
  question: 每个评价分数各有多少条评价？
  gold_sql: 'SELECT review_score, COUNT(*) AS cnt

    FROM order_reviews GROUP BY review_score ORDER BY review_score;

    '
  notes: ''
- id: T2-009
  difficulty: single_table_agg
  tags:
  - 聚合
  - 分组
  - 排序
  question: 商品数量最多的 10 个类目是哪些？
  gold_sql: 'SELECT product_category_name, COUNT(*) AS cnt

    FROM products

    WHERE product_category_name IS NOT NULL

    GROUP BY product_category_name ORDER BY cnt DESC,product_category_name ASC LIMIT 10;

    '
  notes: ''
