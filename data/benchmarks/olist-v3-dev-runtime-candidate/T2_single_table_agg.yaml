- id: T2-012
  difficulty: single_table_agg
  tags:
  - 聚合
  - 分组
  - 求和
  question: 每个卖家的运费收入合计是多少？取最高的 10 个。
  gold_sql: 'SELECT seller_id, ROUND(SUM(freight_value), 2) AS total

    FROM order_items GROUP BY seller_id ORDER BY total DESC,seller_id ASC LIMIT 10;

    '
