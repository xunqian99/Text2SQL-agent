- id: T2-014
  difficulty: single_table_agg
  tags:
  - 条件聚合
  question: 支付方式里信用卡和 boleto 各占多少笔？
  gold_sql: "SELECT\n  COUNT(*) FILTER (WHERE payment_type = 'credit_card') AS credit_card,\n  COUNT(*) FILTER (WHERE\
    \ payment_type = 'boleto')      AS boleto\nFROM order_payments;\n"
  notes: ''
