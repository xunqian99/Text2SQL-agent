- id: T2-033
  difficulty: single_table_agg
  tags:
  - 聚合
  - 求和
  question: 全部卖家结算单的应结净额合计是多少？不按打款状态或打款日期筛选。
  gold_sql: SELECT ROUND(SUM(net_amount), 2) FROM settlements;
- id: T2-035
  difficulty: single_table_agg
  tags:
  - 聚合
  - 分组
  - 排序
  question: 搜索次数最多的 10 个关键词是哪些？
  gold_sql: 'SELECT keyword, COUNT(*) AS cnt

    FROM search_logs GROUP BY keyword ORDER BY cnt DESC,keyword ASC NULLS LAST LIMIT 10;'
- id: T2-037
  difficulty: single_table_agg
  tags:
  - HAVING
  question: 按订单关联客户档案所在州统计订单数，超过5000笔的州有哪些？输出州代码和订单数。
  gold_sql: 'SELECT c.customer_state,COUNT(*) AS cnt FROM orders o

    JOIN customers c ON c.customer_id=o.customer_id

    GROUP BY c.customer_state HAVING COUNT(*)>5000 ORDER BY cnt DESC;'
- id: T2-039
  difficulty: single_table_agg
  tags:
  - 条件聚合
  - 比率
  question: 好评（4 分及以上）占所有评价的比例是多少？
  gold_sql: 'SELECT ROUND(COUNT(*) FILTER(WHERE review_score>=4)::numeric/NULLIF(COUNT(*),0),4) AS good_rate

    FROM order_reviews;'
- id: T2-040
  difficulty: single_table_agg
  tags:
