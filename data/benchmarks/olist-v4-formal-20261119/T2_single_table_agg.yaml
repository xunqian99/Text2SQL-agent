- id: T2-002
  difficulty: single_table_agg
  tags:
  - 聚合
  - 求和
  question: 所有订单的运费总额是多少？
  gold_sql: SELECT SUM(freight_value) FROM order_items;
- id: T2-004
  difficulty: single_table_agg
  tags:
  - 聚合
  - 平均
  question: 平均每个订单有多少条明细？
  gold_sql: "SELECT ROUND(AVG(cnt),2) FROM (\n SELECT o.order_id,COUNT(oi.order_item_id) AS cnt\n FROM orders o LEFT JOIN\
    \ order_items oi ON oi.order_id=o.order_id\n GROUP BY o.order_id\n) t;"
  notes: 必须先按订单聚合再求平均，直接对 order_items 求 AVG 是错的。对齐全局两位小数标准。
- id: T2-006
  difficulty: single_table_agg
  tags:
  - 聚合
  - 分组
  question: 每种支付方式各有多少笔支付记录？
  gold_sql: 'SELECT payment_type, COUNT(*) AS cnt

    FROM order_payments GROUP BY payment_type ORDER BY cnt DESC;'
- id: T2-008
  difficulty: single_table_agg
  tags:
  - 聚合
  - 分组
  - 排序
  question: 客户数量最多的 5 个州是哪些？各有多少客户？
  gold_sql: 'SELECT customer_state, COUNT(*) AS cnt

    FROM customers GROUP BY customer_state ORDER BY cnt DESC,customer_state ASC NULLS LAST LIMIT 5;'
- id: T2-011
  difficulty: single_table_agg
  tags:
  - 聚合
  - 分组
  - 求和
  question: 每个卖家的商品销售总额是多少？取金额最高的 10 个卖家。
  gold_sql: 'SELECT seller_id, ROUND(SUM(price), 2) AS total

    FROM order_items GROUP BY seller_id ORDER BY total DESC NULLS LAST,seller_id LIMIT 10;'
- id: T2-013
  difficulty: single_table_agg
  tags:
  - 条件聚合
  question: 已送达订单和已取消订单各有多少笔？
  gold_sql: "SELECT\n  COUNT(*) FILTER (WHERE order_status = 'delivered') AS delivered,\n  COUNT(*) FILTER (WHERE order_status\
    \ = 'canceled')  AS canceled\nFROM orders;"
- id: T2-015
  difficulty: single_table_agg
  tags:
  - 聚合
  - 平均
  question: 按现有会员记录里实际出现的会员等级编号分组，每个等级的平均已知积分是多少？
  gold_sql: 'SELECT level_id, ROUND(AVG(points), 2) AS avg_points

    FROM members GROUP BY level_id ORDER BY level_id;'
