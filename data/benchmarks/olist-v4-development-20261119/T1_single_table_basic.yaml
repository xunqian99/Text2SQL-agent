- id: T1-024
  difficulty: single_table_basic
  tags:
  - 过滤
  - 枚举
  question: 黄金会员有多少人？
  gold_sql: 'SELECT COUNT(*) FROM members m JOIN member_levels l ON l.level_id=m.level_id WHERE l.level_name=''黄金会员'';

    '
  notes: member_levels 表定义 level_id=3 为 GOLD（黄金会员）。
- id: T1-026
  difficulty: single_table_basic
  tags:
  - 排序
  - 限制
  question: 积分最高的10个会员是谁？只考虑已知积分，输出会员ID和积分，同分按会员ID升序严格取10人。
  gold_sql: 'SELECT member_id,points FROM members WHERE points IS NOT NULL ORDER BY points DESC,member_id ASC LIMIT
    10;

    '
  notes: V3开发参考，题面已明确本题定义。
