- id: T1-013
  difficulty: single_table_basic
  tags:
  - 排序
  - 限制
  question: 运费最高的 5 条订单明细是哪几条？
  gold_sql: 'SELECT order_id, order_item_id, freight_value

    FROM order_items ORDER BY freight_value DESC,order_id ASC,order_item_id ASC LIMIT 5;

    '
  notes: ''
