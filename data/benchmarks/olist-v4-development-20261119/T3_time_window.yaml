- id: T3-028
  difficulty: time_window
  tags:
  - 时间
  - 活跃
  question: 以会员表最大最近登录日期为参考日，含参考日在内最近30个自然日登录过的会员有多少人？
  gold_sql: 'SELECT COUNT(*) FROM members

