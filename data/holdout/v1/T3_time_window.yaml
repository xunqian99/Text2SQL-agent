- id: T3-H009
  difficulty: time_window
  tags: [holdout_candidate]
  question: "2018年2月的发货记录中，已签收且签收晚于发货至少7个完整24小时的有多少条？只输出记录数，时间窗口按发货时间。"
  gold_sql: |
    SELECT COUNT(*) AS shipment_count FROM shipments WHERE shipped_at >= '2018-02-01' AND shipped_at < '2018-03-01' AND delivered_at >= shipped_at + INTERVAL '7 days';
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T3-H010
  difficulty: time_window
  tags: [holdout_candidate]
  question: "2018年上半年每月使用优惠券的不同订单数是多少？按使用时间分月，输出月份YYYY-MM和不同订单数，月份升序。"
  gold_sql: |
    SELECT TO_CHAR(used_at, 'YYYY-MM') AS month, COUNT(DISTINCT order_id) AS order_count FROM coupon_usages WHERE used_at >= '2018-01-01' AND used_at < '2018-07-01' GROUP BY 1 ORDER BY 1;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T3-H011
  difficulty: time_window
  tags: [holdout_candidate]
  question: "2018年1月的已解决工单，平均解决耗时为多少小时？起点创建时间，终点解决时间，按秒除3600，保留2位小数，仅输出平均小时；时间窗口按解决时间。"
  gold_sql: |
    SELECT ROUND(AVG(EXTRACT(EPOCH FROM (resolved_at - created_at)) / 3600.0), 2) AS avg_hours FROM support_tickets WHERE resolved_at >= '2018-01-01' AND resolved_at < '2018-02-01';
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T3-H012
  difficulty: time_window
  tags: [holdout_candidate]
  question: "2017年和2018年各年度的全部状态订单中，最晚下单时间分别是什么？输出整数年份和最晚时间，按年份升序。"
  gold_sql: |
    SELECT EXTRACT(YEAR FROM order_purchase_timestamp)::int AS year, MAX(order_purchase_timestamp) AS last_purchase FROM orders WHERE order_purchase_timestamp >= '2017-01-01' AND order_purchase_timestamp < '2019-01-01' GROUP BY 1 ORDER BY 1;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

