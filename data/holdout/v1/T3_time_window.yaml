  difficulty: time_window
  tags: [holdout_candidate]
  question: "按季度统计2018年全部状态订单数，输出1到4的整数季度及订单数，按季度升序；无订单的季度不补零。"
  gold_sql: |
    SELECT EXTRACT(QUARTER FROM order_purchase_timestamp)::int AS quarter, COUNT(*) AS order_count FROM orders WHERE order_purchase_timestamp >= '2018-01-01' AND order_purchase_timestamp < '2019-01-01' GROUP BY 1 ORDER BY 1;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

