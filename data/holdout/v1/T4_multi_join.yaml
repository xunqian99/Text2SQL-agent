- id: T4-H013
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "按工单分类名称汇总客服消息记录数，只看确实有消息的分类；输出分类名和消息数，按数量降序、分类名升序。"
  gold_sql: |
    SELECT c.category_name,COUNT(*) AS message_count FROM ticket_categories c JOIN support_tickets t ON t.category_id=c.category_id JOIN ticket_messages m ON m.ticket_id=t.ticket_id GROUP BY c.category_name ORDER BY message_count DESC,c.category_name;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H014
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "按会员当前等级名称统计搜索记录数，只看正常状态会员且有等级定义；输出等级名称和搜索记录数，按数量降序、等级名升序。"
  gold_sql: |
    SELECT l.level_name,COUNT(*) AS search_count FROM search_logs s JOIN members m ON m.member_id=s.member_id JOIN member_levels l ON l.level_id=m.level_id WHERE m.status=1 GROUP BY l.level_name ORDER BY search_count DESC,l.level_name;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H015
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "按仓库所在大区统计发货记录数，仅统计能匹配区域定义的仓库；输出大区和记录数，按记录数降序、大区升序。"
  gold_sql: |
    SELECT r.macro_region,COUNT(*) AS shipment_count FROM shipments s JOIN warehouses w ON w.warehouse_id=s.warehouse_id JOIN regions r ON r.region_code=w.region_code GROUP BY r.macro_region ORDER BY shipment_count DESC,r.macro_region;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H016
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "2018年上半年申请的已退款明细中，每个商品累计退货数量是多少？只输出商品ID和数量合计，按数量降序、商品ID升序，前6个。"
  gold_sql: |
    SELECT i.product_id,SUM(x.refund_qty) AS total_qty FROM refunds r JOIN refund_items x ON x.refund_id=r.refund_id JOIN order_items i ON i.order_id=x.order_id AND i.order_item_id=x.order_item_id WHERE r.status=4 AND r.requested_at>='2018-01-01' AND r.requested_at<'2018-07-01' GROUP BY i.product_id ORDER BY total_qty DESC,i.product_id LIMIT 6;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H017
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "按卖家所在州汇总已打款结算单净额，只输出州代码和净额合计，按净额降序、州代码升序，最多10州。"
  gold_sql: |
    SELECT s.seller_state,SUM(t.net_amount) AS total_net FROM settlements t JOIN sellers s ON s.seller_id=t.seller_id WHERE t.status=3 GROUP BY s.seller_state ORDER BY total_net DESC,s.seller_state LIMIT 10;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H018
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "按商品英文类目名统计商品个数，只统计有翻译的商品；输出英文类目和商品数，按数量降序、英文类目升序，前7类。"
