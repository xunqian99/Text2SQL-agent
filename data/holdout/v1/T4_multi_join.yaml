- id: T4-H020
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "按订单状态统计收到1星评价的不同订单数，包含全部状态；只输出状态和不同订单数，按状态升序，不输出没有1星评价的状态。"
  gold_sql: |
    SELECT o.order_status,COUNT(DISTINCT o.order_id) AS order_count FROM orders o JOIN order_reviews r ON r.order_id=o.order_id WHERE r.review_score=1 GROUP BY o.order_status ORDER BY o.order_status;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H021
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "每个仓库覆盖多少个有库存记录的商品类目？类目不能为空；输出仓库ID和不同类目数，只看有此类库存的仓库，按仓库ID升序。"
  gold_sql: |
    SELECT i.warehouse_id,COUNT(DISTINCT p.product_category_name) AS category_count FROM inventory i JOIN products p ON p.product_id=i.product_id WHERE p.product_category_name IS NOT NULL GROUP BY i.warehouse_id ORDER BY i.warehouse_id;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H022
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "列出搜索记录数最多的前6位会员，只输出会员ID、当前积分和搜索次数；包含全部会员状态，次数降序、会员ID升序。"
  gold_sql: |
    SELECT m.member_id,m.points,COUNT(*) AS search_count FROM members m JOIN search_logs s ON s.member_id=m.member_id GROUP BY m.member_id,m.points ORDER BY search_count DESC,m.member_id LIMIT 6;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"
