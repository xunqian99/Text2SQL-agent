- id: T4-H001
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "按会员当前等级名称统计冻结会员数，只看存在等级定义的会员；输出等级名称和人数，按人数降序、名称升序。"
  gold_sql: |
    SELECT l.level_name, COUNT(*) AS member_count FROM members m JOIN member_levels l ON l.level_id = m.level_id WHERE m.status = 2 GROUP BY l.level_name ORDER BY member_count DESC, l.level_name;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H002
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "各客服分类中尚未解决的工单有多少张？所有分类都输出，缺失计0；仅输出分类ID、分类名和数量，按分类ID升序。"
  gold_sql: |
    SELECT c.category_id, c.category_name, COUNT(t.ticket_id) AS ticket_count FROM ticket_categories c LEFT JOIN support_tickets t ON t.category_id = c.category_id AND t.resolved_at IS NULL GROUP BY c.category_id, c.category_name ORDER BY c.category_id;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H003
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "各仓库有多少条异常发货记录？状态4为异常，所有仓库都输出，缺失计0；输出仓库ID、名称、记录数，按仓库ID升序。"
  gold_sql: |
    SELECT w.warehouse_id, w.warehouse_name, COUNT(s.shipment_id) AS shipment_count FROM warehouses w LEFT JOIN shipments s ON s.warehouse_id = w.warehouse_id AND s.status = 4 GROUP BY w.warehouse_id,w.warehouse_name ORDER BY w.warehouse_id;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H004
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "各营销活动的优惠券使用记录总数是多少？输出活动ID、名称和记录数，所有活动都要保留，未使用记0，按活动ID升序。"
  gold_sql: |
    SELECT c.campaign_id, c.campaign_name, COUNT(u.usage_id) AS usage_count FROM campaigns c LEFT JOIN coupons p ON p.campaign_id = c.campaign_id LEFT JOIN coupon_usages u ON u.coupon_id = p.coupon_id GROUP BY c.campaign_id,c.campaign_name ORDER BY c.campaign_id;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H005
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "会员中没有任何用户标签映射的有多少人？包含全部会员状态，只输出人数。"
  gold_sql: |
    SELECT COUNT(*) AS member_count FROM members m WHERE NOT EXISTS (SELECT 1 FROM user_tag_map t WHERE t.member_id = m.member_id);
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H006
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "按标签名称统计有该标签的冻结会员人数，只保留实际有人的标签；输出标签名称和人数，按人数降序、名称升序，最多10个。"
  gold_sql: |
    SELECT t.tag_name, COUNT(DISTINCT m.member_id) AS member_count FROM user_tags t JOIN user_tag_map x ON x.tag_id = t.tag_id JOIN members m ON m.member_id = x.member_id WHERE m.status = 2 GROUP BY t.tag_name ORDER BY member_count DESC,t.tag_name LIMIT 10;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H007
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "按客户所在州统计2018年第二季度的全部状态订单数，输出州代码和订单数，按数量降序、州代码升序，最多10州。"
  gold_sql: |
    SELECT c.customer_state, COUNT(*) AS order_count FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE o.order_purchase_timestamp >= '2018-04-01' AND o.order_purchase_timestamp < '2018-07-01' GROUP BY c.customer_state ORDER BY order_count DESC,c.customer_state LIMIT 10;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H008
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "所有订单中，客户所在州为SP且已退款状态4的退款单总额是多少？包含全部订单状态，仅输出退款金额合计，不连接订单明细。"
  gold_sql: |
    SELECT SUM(r.refund_amount) AS total_refund FROM refunds r JOIN orders o ON o.order_id = r.order_id JOIN customers c ON c.customer_id = o.customer_id WHERE r.status = 4 AND c.customer_state = 'SP';
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H009
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "按卖家所在州统计订单明细的商品金额合计，包含全部订单状态；输出州代码和商品金额，按金额降序、州代码升序，最多8州。"
  gold_sql: |
    SELECT s.seller_state, SUM(i.price) AS total_price FROM order_items i JOIN sellers s ON s.seller_id = i.seller_id GROUP BY s.seller_state ORDER BY total_price DESC,s.seller_state LIMIT 8;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H010
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "各当前品牌映射对应的商品有多少个？只统计is_current为真的映射，输出品牌ID、名称和不同商品数，按数量降序、品牌ID升序，最多10个品牌。"
  gold_sql: |
    SELECT b.brand_id,b.brand_name,COUNT(DISTINCT m.product_id) AS product_count FROM brands b JOIN product_brand_map m ON m.brand_id=b.brand_id WHERE m.is_current=true GROUP BY b.brand_id,b.brand_name ORDER BY product_count DESC,b.brand_id LIMIT 10;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T4-H011
  difficulty: multi_join
  tags: [holdout_candidate]
  question: "按仓库名称统计库存不足记录数，库存不足指quantity小于safety_stock；输出仓库ID、名称和数量，只保留有不足记录的仓库，按仓库ID升序。"
  gold_sql: |
    SELECT w.warehouse_id,w.warehouse_name,COUNT(*) AS shortage_count FROM warehouses w JOIN inventory i ON i.warehouse_id=w.warehouse_id WHERE i.quantity<i.safety_stock GROUP BY w.warehouse_id,w.warehouse_name ORDER BY w.warehouse_id;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

