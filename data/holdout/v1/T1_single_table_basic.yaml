- id: T1-H001
  difficulty: single_table_basic
  tags: [holdout_candidate]
  question: "统计状态为冻结且积分至少500的会员人数，只输出人数。"
  gold_sql: |
    SELECT COUNT(*) AS member_count FROM members WHERE status = 2 AND points >= 500;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

