- id: T2-H001
  difficulty: single_table_agg
  tags: [holdout_candidate]
  question: "按会员状态统计会员人数及平均积分，平均积分保留2位小数，只输出状态、人数和平均积分，按状态升序。"
  gold_sql: |
    SELECT status, COUNT(*) AS member_count, ROUND(AVG(points), 2) AS avg_points FROM members GROUP BY status ORDER BY status;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T2-H002
  difficulty: single_table_agg
  tags: [holdout_candidate]
  question: "按折扣类型统计优惠券数量和最大折扣值，只输出类型、数量、最大折扣值，类型升序且空值最后。"
  gold_sql: |
    SELECT discount_type, COUNT(*) AS coupon_count, MAX(discount_value) AS max_discount FROM coupons GROUP BY discount_type ORDER BY discount_type NULLS LAST;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T2-H003
  difficulty: single_table_agg
  tags: [holdout_candidate]
  question: "每种退款原因的已退款金额总和是多少？仅状态4，输出原因代码和金额合计，金额降序、原因代码升序，最多10类。"
  gold_sql: |
    SELECT reason_code, SUM(refund_amount) AS total_refund FROM refunds WHERE status = 4 GROUP BY reason_code ORDER BY total_refund DESC NULLS LAST, reason_code ASC NULLS LAST LIMIT 10;
  notes: "题干已指定统计粒度、范围及输出；不得根据模型得分修改本条。"

- id: T2-H004
  difficulty: single_table_agg
  tags: [holdout_candidate]
  question: "库存按仓库汇总，列出库存总量至少500的仓库；只输出仓库ID和库存总量，按总量降序、仓库ID升序，最多10个。"
  gold_sql: |
    SELECT warehouse_id, SUM(quantity) AS total_quantity FROM inventory GROUP BY warehouse_id HAVING SUM(quantity) >= 500 ORDER BY total_quantity DESC, warehouse_id LIMIT 10;
