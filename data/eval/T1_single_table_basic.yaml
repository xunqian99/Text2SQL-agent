- id: T1-024
  difficulty: single_table_basic
  tags: [过滤, 枚举]
  question: 黄金会员有多少人？
  gold_sql: |
    SELECT COUNT(*) FROM members WHERE level_id = 3;
  notes: member_levels 表定义 level_id=3 为 GOLD（黄金会员）。

- id: T1-025
  difficulty: single_table_basic
  tags: [过滤, 枚举]
  question: 状态为冻结的会员有多少人？
  gold_sql: |
    SELECT COUNT(*) FROM members WHERE status = 2;
  notes: members.status 是数字代码：1=正常 2=冻结 3=注销，模型必须知道映射才能写对。

- id: T1-026
  difficulty: single_table_basic
  tags: [排序, 限制]
  question: 积分最高的 10 个会员是谁？
  gold_sql: |
    SELECT member_id, points FROM members ORDER BY points DESC LIMIT 10;

- id: T1-027
  difficulty: single_table_basic
