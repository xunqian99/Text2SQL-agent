- id: T1-018
  difficulty: single_table_basic
  tags: [过滤, 数值]
  question: 订单明细里运费超过 50 的有多少条？
  gold_sql: |
    SELECT COUNT(*) FROM order_items WHERE freight_value > 50;
  notes: 运费字段是 freight_value，与商品价格 price 分开统计。运费的 NULL 判断和数值过滤是两回事，这里考的是数值过滤。

