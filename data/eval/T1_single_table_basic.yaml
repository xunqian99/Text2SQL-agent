    SELECT COUNT(DISTINCT order_status) FROM orders;

- id: T1-011
  difficulty: single_table_basic
  tags: [去重]
  question: 商品类目一共有多少个？
  gold_sql: |
    SELECT COUNT(DISTINCT product_category_name) FROM products;

- id: T1-012
  difficulty: single_table_basic
  tags: [排序, 限制]
  question: 价格最高的 10 条订单明细是哪些？
  gold_sql: |
    SELECT order_id, order_item_id, price
    FROM order_items ORDER BY price DESC LIMIT 10;

- id: T1-013
  difficulty: single_table_basic
  tags: [排序, 限制]
  question: 运费最高的 5 条订单明细是哪几条？
  gold_sql: |
    SELECT order_id, order_item_id, freight_value
    FROM order_items ORDER BY freight_value DESC LIMIT 5;

