# 难度层 1：单表基础查询（40 条）
# 覆盖：过滤、排序、去重、NULL 判断、简单计数
# 这一层用来验证链路是否通畅。如果这层准确率都上不去，问题在工程而不在检索。
#
# notes 字段记录口径假设。标 【需确认】 的条目需要用户审核业务口径。

- id: T1-001
  difficulty: single_table_basic
  tags: [计数]
  question: 一共有多少笔订单？
  gold_sql: |
    SELECT COUNT(*) FROM orders;

- id: T1-002
  difficulty: single_table_basic
  tags: [过滤, 时间]
  question: 2018 年下单的订单有多少笔？
  gold_sql: |
    SELECT COUNT(*) FROM orders
    WHERE order_purchase_timestamp >= '2018-01-01'
      AND order_purchase_timestamp < '2019-01-01';
  notes: 时间口径取 order_purchase_timestamp（下单时间），非支付或送达时间。

- id: T1-003
  difficulty: single_table_basic
  tags: [过滤, 枚举]
  question: 已取消的订单有多少笔？
  gold_sql: |
    SELECT COUNT(*) FROM orders WHERE order_status = 'canceled';

- id: T1-004
  difficulty: single_table_basic
  tags: [计数, 去重]
  question: 一共有多少个不同的客户（按自然人统计，同一人多次下单只算一个）？
  gold_sql: |
    SELECT COUNT(DISTINCT customer_unique_id) FROM customers;
  notes: 客户表 99441 行是「订单级」客户，customer_unique_id 去重后是 96096 个自然人。这是 customer_id 与 customer_unique_id 的经典区别。

- id: T1-005
  difficulty: single_table_basic
  tags: [过滤, 数值]
  question: 单价超过 1000 的订单明细有多少条？
  gold_sql: |
    SELECT COUNT(*) FROM order_items WHERE price > 1000;
  notes: 价格口径取 order_items.price（商品单价，不含运费），不是 freight_value，也不是订单总价 payment_value。

- id: T1-006
  difficulty: single_table_basic
  tags: [计数]
  question: 商品表里有多少个商品？
  gold_sql: |
    SELECT COUNT(*) FROM products;

- id: T1-007
  difficulty: single_table_basic
  tags: [计数]
  question: 一共有多少个卖家？
  gold_sql: |
    SELECT COUNT(*) FROM sellers;

- id: T1-008
  difficulty: single_table_basic
  tags: [去重]
  question: 客户分布在多少个不同的城市？
